name: Build Stride

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # "true" only when you've added the keystore secret (secrets can't be used in `if:` directly).
      HAS_KEYSTORE: ${{ secrets.STRIDE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads between runs and validates gradle-wrapper.jar against
      # Gradle's published checksums (protects against a tampered wrapper).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional: sign release APKs with your own key. Only runs if the
      # STRIDE_KEYSTORE_BASE64 secret exists (not on pull requests from forks).
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.STRIDE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stride-release.jks"
          echo "STRIDE_KEYSTORE_FILE=$RUNNER_TEMP/stride-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        env:
          STRIDE_KEYSTORE_PASSWORD: ${{ secrets.STRIDE_KEYSTORE_PASSWORD }}
          STRIDE_KEY_ALIAS: ${{ secrets.STRIDE_KEY_ALIAS }}
          STRIDE_KEY_PASSWORD: ${{ secrets.STRIDE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk     "dist/Stride-debug-$SHA.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/Stride-$SHA.apk"
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Stride-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/stride-release.jks"

  # Pushing a tag like v1.0.0 publishes a GitHub Release with the APK attached.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: Stride-apks
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Stride-*.apk
          generate_release_notes: true
